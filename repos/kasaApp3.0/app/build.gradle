plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'com.google.gms.google-services'

}

ext {
    Java_Version = JavaVersion.VERSION_1_8
    Kotlin_Language_Version = '1.7'
    Kotlin_Plugin_Version = '1.7.0'
}

android {
    namespace 'com.nekorom.kasaapp'
    compileSdk 34


    defaultConfig {
        applicationId "com.nekorom.kasaapp"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }



    buildTypes {
        release {
            shrinkResources false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug{
            shrinkResources false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = Java_Version.versionName
        languageVersion = Kotlin_Language_Version
        apiVersion = Kotlin_Language_Version
    }
    buildFeatures {
        compose true
        viewBinding true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.10'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    //edge to edge
    implementation "com.google.accompanist:accompanist-systemuicontroller:0.28.0"
    //edge to edge

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation "androidx.recyclerview:recyclerview:1.3.2"

    implementation project(path: ':bt')

//room
    implementation 'androidx.room:room-ktx:2.6.1'
    implementation "androidx.room:room-runtime:2.6.1"
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    kapt "androidx.room:room-compiler:2.6.1"
    //end room

    //firebase
    implementation platform('com.google.firebase:firebase-bom:32.8.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation "com.google.firebase:firebase-database"

    //end firebase

 

    //hilt
    implementation 'com.google.dagger:hilt-android:2.48'
    kapt 'com.google.dagger:hilt-compiler:2.48'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
        //end hilt

    //camera
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'
    implementation 'androidx.camera:camera-core:1.3.2'


    def camerax_version = "1.4.0-alpha04"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
//compose
    implementation "androidx.compose.runtime:runtime-livedata:1.6.4"
    implementation 'androidx.compose.material:material-icons-extended'
    implementation "com.chargemap.compose:numberpicker:1.0.3"
    implementation 'com.google.android.material:material:1.11.0'



    //compose end
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    implementation 'androidx.appcompat:appcompat:1.6.1'

    def nav_version = '2.7.7'
    implementation("androidx.navigation:navigation-compose:$nav_version")



    implementation 'androidx.core:core-ktx:1.12.0'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.20')
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation platform('androidx.compose:compose-bom:2024.03.00')
    implementation 'androidx.compose.ui:ui'

    def composeViewBind_ver = '1.6.4'
    implementation("androidx.compose.ui:ui-viewbinding:$composeViewBind_ver")
    //swipe


    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation "androidx.compose.material3:material3:1.2.1"
    implementation "androidx.compose.material3:material3-window-size-class:1.2.1"
    implementation "androidx.compose.ui:ui-unit:1.6.4"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.03.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    //text


}